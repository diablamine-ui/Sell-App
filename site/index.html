<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilam B' — Les livres à p'tits prix, livrés à Abidjan</title>
<meta name="description" content="Livres de finances, développement personnel, productivité et histoire africaine. Paiement à la livraison, livraison en 24 h à Abidjan et partout en Côte d'Ivoire.">
<meta name="theme-color" content="#0D3B2E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dilam B'">
<meta property="og:title" content="Dilam B' — Les livres à p'tits prix">
<meta property="og:description" content="Paiement à la livraison. Livraison en 24 h à Abidjan, partout en Côte d'Ivoire.">
<meta property="og:image" content="/public/images/logo.png">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>

<div class="notice" id="notice" hidden></div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/" data-nav="home" aria-label="Dilam B', accueil">
      <span class="brand-name">Dilam B'</span>
      <span class="brand-sub">Les livres à p'tits prix</span>
    </a>
    <nav class="top-actions" aria-label="Actions">
      <a class="icon-btn" href="/?vue=livres" data-nav="livres" aria-label="Rechercher un livre">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </a>
      <a class="icon-btn" id="waTop" href="#" target="_blank" rel="noopener" aria-label="Écrire sur WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z"/><path d="M9.2 8.6c.3 2.6 2.4 4.9 5.2 5.6l1.1-1.1-1.8-.9-.7.7c-1-.4-1.9-1.3-2.4-2.4l.7-.7-.8-1.8z" class="fill"/></svg>
      </a>
      <button class="icon-btn cart-btn" id="cartBtn" type="button" aria-label="Ouvrir le panier">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 4h2.6l2.3 10.6a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.6-1.2L20.8 8H6"/><circle cx="9.7" cy="19.6" r="1.35"/><circle cx="17.2" cy="19.6" r="1.35"/></svg>
        <span class="cart-count" id="cartCount" hidden>0</span>
      </button>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="view"><div class="loading" aria-live="polite">Chargement des livres…</div></div>
</main>

<footer class="foot">
  <div class="foot-in">
    <p class="foot-name">Dilam B'</p>
    <p class="foot-line">Librairie en ligne basée à Abidjan. Livraison partout en Côte d'Ivoire.</p>
    <p class="foot-line"><a href="#" id="waFoot" target="_blank" rel="noopener">Nous écrire sur WhatsApp</a></p>
    <p class="foot-links"><a href="/conditions">Conditions de vente</a><a href="/confidentialite">Confidentialité</a><a href="mailto:diab.lamine@gmail.com">diab.lamine@gmail.com</a></p>
    <p class="foot-small">© <span id="year"></span> Dilam B'</p>
  </div>
</footer>

<!-- Barre fixe sur la fiche livre -->
<div class="buybar" id="buybar" hidden>
  <div class="buybar-in">
    <div class="buybar-price" id="buybarPrice"></div>
    <button class="btn btn-primary" id="buybarBtn" type="button">Commander</button>
  </div>
</div>

<!-- Panier -->
<div class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="cartTitle">Ton panier</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fermer le panier">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="cartBody"></div>
  </div>
</div>

<!-- Commande directe d'un livre -->
<div class="sheet" id="orderSheet" role="dialog" aria-modal="true" aria-labelledby="orderTitle" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="orderTitle">Commander</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="orderBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/app.js" defer></script>
</body>
</html>
