<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ebooks | Admin Dilam B'</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body { background: #161D1A; color: #E9EEEA; }
  .wrap-a { max-width: 760px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font-size: 26px; color: #fff; }
  h2 { font-size: 20px; color: #fff; margin: 30px 0 10px; }
  a { color: #9FD8B9; }
  .card { background: #1E2622; border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #2C3631; }
  .row:first-of-type { border-top: 0; }
  .row small { display: block; color: #9AA8A0; font-size: 13px; margin-top: 2px; }
  .ok { color: #9FD8B9; } .ko { color: #F0B27A; }
  label.up { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #fff; color: #13201A; font-weight: 600; font-size: 14px; cursor: pointer; }
  label.up input { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid #2C3631; vertical-align: top; }
  th { color: #9AA8A0; font-weight: 500; }
  .muted { color: #9AA8A0; }
  .scroll { overflow-x: auto; }
  .ebook-card { margin-top: 18px; }
  .lab { display: block; color: #C9D3CD; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; }
  .in { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #34403A; background: #111714; color: #fff; font-size: 15px; }
  .in.num { max-width: 140px; }
  .in.inl { display: inline-block; width: auto; min-width: 160px; }
  .chk { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14.5px; }
  .cover-row, .page-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cov { width: 56px; border-radius: 3px; }
  .ban { width: 120px; border-radius: 6px; }
  .bmsg { display: block; margin-top: 6px; color: #C9D3CD; }
  .frow { display: grid; grid-template-columns: 1fr 90px; gap: 8px; padding: 10px 0; border-top: 1px solid #2C3631; }
  .fst { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mini-b { margin-top: 10px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #9FD8B9; background: transparent; color: #9FD8B9; font-weight: 600; cursor: pointer; }
  .big-b { margin-top: 16px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: #fff; color: #13201A; font-weight: 700; font-size: 15px; cursor: pointer; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .msg { color: #C9D3CD; }
  .small { font-size: 13.5px; margin-top: 2px; }
  .mlist { display: grid; gap: 10px; margin-top: 8px; }
  .mrow { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 10px; border-radius: 10px; background: #111714; }
  .mth { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: #2C3631; }
  .mmain { display: grid; gap: 8px; min-width: 0; }
  .mmain strong { color: #fff; font-size: 14.5px; }
  .mmain select.in { min-height: 40px; }
  .mbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .mbtns .mini-b { margin-top: 0; min-height: 34px; padding: 0 12px; font-size: 13.5px; }
  .mini-b.ko-b { border-color: #F0B27A; color: #F0B27A; }
  .madd { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .madd .mini-b { margin-top: 0; min-height: 40px; }
  .myt { display: flex; gap: 8px; margin-top: 10px; }
  .myt .mini-b { margin-top: 0; min-height: 44px; flex: none; }
  .mmsg { display: block; margin-top: 8px; color: #C9D3CD; }
  .guide { white-space: pre-wrap; font-family: inherit; font-size: 14px; line-height: 1.55; color: #E9EEEA; background: #111714; border-radius: 10px; padding: 12px; margin-top: 10px; }
</style>
</head>
<body>
<main class="wrap-a" id="app"><p class="muted">Chargement…</p></main>
<script src="/assets/admin-ebooks.js" defer></script>
</body>
</html>
